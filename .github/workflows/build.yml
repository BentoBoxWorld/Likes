name: Build
on:
  push:
    branches:
      - develop
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # lets the job request a GitHub OIDC token for secretless SonarQube Cloud analysis
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 25
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      # Build, run tests and generate the JaCoCo coverage report (target/site/jacoco/jacoco.xml).
      - name: Build and test
        run: mvn -B verify
      # Pull requests from forks cannot get an OIDC token, so they are built and tested but not analyzed.
      - name: Cache SonarQube packages
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # Exchanges the GitHub OIDC token for a short-lived SonarQube Cloud token, exported as SONAR_TOKEN.
      - name: SonarQube authentication
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        id: auth
      # The Maven scanner reads SONAR_TOKEN and the sonar.* properties in pom.xml.
      - name: SonarQube scan
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
